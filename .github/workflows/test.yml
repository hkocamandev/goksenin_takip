name: Test

# Her PR'da yayınla aynı kontroller çalışır; sonuç PR sayfasında ✓/✗ olarak görünür.
on:
  pull_request:
    branches: [main]

# Varsayılan: hiçbir yetki. Bu iş yalnızca kodu okur; sır kullanmaz, yayın yapmaz.
permissions: {}

# Aynı PR'a yeni commit gelince eski çalışma iptal edilir.
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Bağımlılık güvenlik taraması
        run: npm audit --audit-level=high
      - run: npx vitest run
      # Backend adresi gerekmez: derlemenin hatasız bittiğini doğrulamak yeterli.
      - run: npm run build
